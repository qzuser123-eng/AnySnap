name: macOS release build

# Builds a universal (Apple silicon + Intel) AnySnap.app and attaches it to a GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the app to (e.g. v0.1.0)
        required: true

jobs:
  app:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'linux-mcp'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Build universal app (ad-hoc signed)
        run: |
          swift --version
          ANYSNAP_SIGN_IDENTITY=- ANYSNAP_ARCHS="arm64 x86_64" ./scripts/build-app.sh
          lipo -archs build/AnySnap.app/Contents/MacOS/AnySnap
          lipo -archs build/AnySnap.app/Contents/Helpers/anysnap
          codesign --verify --deep --strict build/AnySnap.app
          build/AnySnap.app/Contents/Helpers/anysnap help | head -3
      - name: Zip and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="AnySnap-${TAG}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent build/AnySnap.app "$ZIP"
          shasum -a 256 "$ZIP"
          gh release upload "$TAG" "$ZIP" --clobber
