name: macOS release build

# Builds a universal (Apple silicon + Intel) AnySnap.app and attaches it to a GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the app to (e.g. v0.1.0)
        required: true

jobs:
  app:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'linux-mcp'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Import release signing certificate
        # A fixed self-signed "AnySnap Release" certificate (repository secrets), so every
        # release has the same code identity and macOS keeps the user's permissions after
        # updates. Without the secrets the app is ad-hoc signed.
        env:
          P12: ${{ secrets.ANYSNAP_RELEASE_P12 }}
          P12_PASSWORD: ${{ secrets.ANYSNAP_RELEASE_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "SIGN_ID=-" >> "$GITHUB_ENV"; echo "No certificate: ad-hoc signing"; exit 0; fi
          KC="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity "$KC"
          ID=$(security find-identity "$KC" | awk '/"AnySnap Release"/ {print $2; exit}')
          test -n "$ID"
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"
      - name: Build universal app
        run: |
          swift --version
          ANYSNAP_SIGN_IDENTITY="$SIGN_ID" ANYSNAP_ARCHS="arm64 x86_64" ./scripts/build-app.sh
          codesign -dvv build/AnySnap.app 2>&1 | grep -E "Authority|Identifier|Signature"
          codesign -d -r- build/AnySnap.app
          lipo -archs build/AnySnap.app/Contents/MacOS/AnySnap
          lipo -archs build/AnySnap.app/Contents/Helpers/anysnap
          build/AnySnap.app/Contents/Helpers/anysnap help | head -3
      - name: Zip and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="AnySnap-${TAG}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent build/AnySnap.app "$ZIP"
          shasum -a 256 "$ZIP"
          gh release upload "$TAG" "$ZIP" --clobber
