name: 💡 Feature request / 功能建议
description: Suggest an idea or improvement / 提一个想法或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do? / 你想做到什么？
      description: Describe the situation and what is missing today. / 描述你的使用场景，以及现在缺什么。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work? / 你希望它怎么工作？
  - type: input
    id: apps
    attributes:
      label: Apps or agents involved / 涉及的应用或 AI
      placeholder: e.g. Zotero, Obsidian, Cursor, DeepSeek
